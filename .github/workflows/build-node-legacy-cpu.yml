name: build-node-legacy-cpu

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Detect version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Install dependencies
        run: bun install

      - name: Install platform packages (linux-x64)
        run: |
          bun install --os=linux --cpu=x64 @opentui/core-linux-x64@0.4.5
          bun install --os=linux --cpu=x64 @lydell/node-pty-linux-x64@1.2.0-beta.12

      - name: Assemble portable Node package
        run: bun run script/package-node-cli.ts --node-version 22.16.0
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: latest

      - name: Smoke test
        run: |
          ./dist/opencode-node/bin/opencode --version
          ./dist/opencode-node/bin/opencode models | head -5

      - name: Create tarball
        run: |
          tar -czf opencode-linux-x64-node.tar.gz -C packages/opencode/dist opencode-node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64-node
          path: opencode-linux-x64-node.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: opencode-linux-x64-node.tar.gz
          generate_release_notes: true